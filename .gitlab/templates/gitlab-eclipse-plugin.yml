build plugin:
  stage: build
  script:
     - ./gradlew assemble

detekt:
  stage: lint
  needs: [ ]
  script:
    - gradle --continue detektMain detektTest
  artifacts:
    paths:
      - build/reports/detekt/main.html
      - build/reports/detekt/test.html
    expose_as: Detekt HTML reports
    when: always
    expire_in: 2 weeks

check plugin:
  stage: test
  script:
     - ./gradlew check

publish plugin (snapshot):
  stage: deploy
  script:
    - |-
      if ./gradlew checkSnapshotVersion; then
        ./gradlew publish
      else
        echo 'WARNING: Skipping publish to package registry due to project version missing -SNAPSHOT suffix. If this is an error please amend build.gradle.kts.'
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish plugin (release):
  stage: release
  script:
    - ./gradlew checkReleaseVersion
    - ./gradlew publish publishToMavenLocal
  rules:
    - if: $CI_COMMIT_TAG