.maven:
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    MAVEN_CLI_OPTS: "-s settings.xml --batch-mode --no-transfer-progress"

deploy update site (snapshot):
  extends: .maven
  needs: ["publish plugin (snapshot)"]
  stage: deploy
  script:
    - cd update-site
    - mvn $MAVEN_CLI_OPTS deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths:
      - update-site/target/repository/

deploy update site (release):
  extends: .maven
  needs: ["publish plugin (release)"]
  stage: release
  script:
    - cd update-site
    - mvn $MAVEN_CLI_OPTS versions:set -DnewVersion=${CI_COMMIT_TAG:1}
    - mvn $MAVEN_CLI_OPTS deploy
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - update-site/target/repository/

publish eclipse repository:
  needs: ["deploy update site (release)"]
  stage: release
  script:
    - ./gradlew publishToGitLab
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - build/release/asset-links.json

release eclipse repository:
  image: gitlab/glab
  needs: ["publish eclipse repository"]
  stage: release
  script:
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_HOST --api-protocol $CI_SERVER_PROTOCOL
    - glab release create "${CI_COMMIT_TAG}" --repo "${CI_PROJECT_PATH}" --assets-links "$(cat ./build/release/asset-links.json)" -F CHANGELOG.md
  rules:
    - if: $CI_COMMIT_TAG
